<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Recruiter Portal — NFSU Placement</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="menu-toggle" id="menu-toggle">☰</button>
        <span class="topbar-title" id="page-title">Recruiter Portal</span>
      </div>
      <div class="topbar-right">
        <span class="topbar-badge">2026–27</span>
      </div>
    </header>

    <div class="page-content">
      <div class="page-header">
        <div>
          <h1 id="company-title">Recruiter Portal</h1>
          <p id="company-sub">Loading company info…</p>
        </div>
        <button class="btn btn-secondary btn-sm" onclick="load()">🔄 Refresh</button>
      </div>

      <!-- Company Info Card -->
      <div class="card" style="margin-bottom:20px" id="company-card">
        <div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap">
          <div style="width:56px;height:56px;border-radius:12px;background:rgba(59,130,246,.15);display:flex;align-items:center;justify-content:center;font-size:1.6rem">🏢</div>
          <div style="flex:1">
            <div style="font-size:1.1rem;font-weight:700" id="c-name">—</div>
            <div style="display:flex;gap:10px;margin-top:6px;flex-wrap:wrap">
              <span id="c-category">—</span>
              <span id="c-package" style="font-size:.85rem;color:var(--text-muted)">—</span>
              <span id="c-status">—</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Stats -->
      <div class="stats-grid" style="margin-bottom:24px">
        <div class="stat-card"><div class="stat-icon blue">📋</div><div><div class="stat-value" id="s-total">—</div><div class="stat-label">Total Offers</div></div></div>
        <div class="stat-card"><div class="stat-icon green">✅</div><div><div class="stat-value" id="s-accepted">—</div><div class="stat-label">Accepted</div></div></div>
        <div class="stat-card"><div class="stat-icon amber">⏳</div><div><div class="stat-value" id="s-pending">—</div><div class="stat-label">Pending</div></div></div>
        <div class="stat-card"><div class="stat-icon purple">🏢</div><div><div class="stat-value" id="s-joined">—</div><div class="stat-label">Joined</div></div></div>
      </div>

      <!-- Offers Table -->
      <div class="card">
        <div class="card-header">
          <span class="card-title">📋 Offers from Your Company</span>
          <div style="display:flex;gap:8px">
            <select id="filter-type" onchange="load()">
              <option value="">All Types</option>
              <option value="I">Internship</option>
              <option value="F">FTE</option>
              <option value="I+F">I+F</option>
            </select>
            <select id="filter-acceptance" onchange="load()">
              <option value="">All Status</option>
              <option value="pending">Pending</option>
              <option value="accepted">Accepted</option>
              <option value="declined">Declined</option>
            </select>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>Student</th><th>Course</th><th>Type</th><th>Package</th><th>Offer Date</th><th>Acceptance</th><th>Joining</th></tr>
            </thead>
            <tbody id="offers-tbody">
              <tr><td colspan="7" style="text-align:center;padding:32px;color:var(--text-muted)">Loading…</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="../js/app.js"></script>
<script>
  const user = requireAuth(['recruiter']);
  initPage('Recruiter Portal', 'Recruiter Portal');

  const ACCEPTANCE = {
    accepted: { cls:'badge-success', label:'Accepted' },
    declined: { cls:'badge-danger',  label:'Declined' },
    pending:  { cls:'badge-warning', label:'Pending'  },
    expired:  { cls:'badge-gray',    label:'Expired'  },
  };
  const JOINING = {
    joined:     { cls:'badge-success', label:'Joined'     },
    not_joined: { cls:'badge-danger',  label:'Not Joined' },
    pending:    { cls:'badge-warning', label:'Pending'    },
  };

  async function loadCompany() {
    const companyId = user.companyAssigned;
    if (!companyId) return;
    const res = await apiFetch('/companies/' + companyId);
    const c = res?.data?.company;
    if (!c) return;
    document.getElementById('company-title').textContent = c.name;
    document.getElementById('company-sub').textContent = `Category ${c.category} · ₹${c.minPackageLPA}–${c.maxPackageLPA} LPA`;
    document.getElementById('c-name').textContent = c.name;
    document.getElementById('c-category').innerHTML = statusBadge(c.category, CATEGORY_BADGE);
    document.getElementById('c-package').textContent = `₹${c.minPackageLPA}–${c.maxPackageLPA} LPA`;
    document.getElementById('c-status').innerHTML = `<span class="badge ${c.isActive ? 'badge-success' : 'badge-gray'}">${c.isActive ? 'Active' : 'Inactive'}</span>`;
  }

  async function load() {
    const type = document.getElementById('filter-type').value;
    const acceptance = document.getElementById('filter-acceptance').value;
    const params = new URLSearchParams();
    if (type) params.set('offerType', type);
    if (acceptance) params.set('acceptanceStatus', acceptance);

    const tbody = document.getElementById('offers-tbody');
    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:32px;color:var(--text-muted)">Loading…</td></tr>';

    const res = await apiFetch('/offers?' + params);
    const offers = res?.data?.offers || [];

    // Stats
    document.getElementById('s-total').textContent    = offers.length;
    document.getElementById('s-accepted').textContent = offers.filter(o => o.acceptanceStatus === 'accepted').length;
    document.getElementById('s-pending').textContent  = offers.filter(o => o.acceptanceStatus === 'pending').length;
    document.getElementById('s-joined').textContent   = offers.filter(o => o.joiningStatus === 'joined').length;

    if (!offers.length) {
      tbody.innerHTML = '<tr><td colspan="7"><div class="empty-state"><div class="empty-icon">📋</div><p>No offers found</p></div></td></tr>';
      return;
    }

    tbody.innerHTML = offers.map(o => `<tr>
      <td><strong>${o.student?.name || '—'}</strong><br><span class="td-muted">${o.student?.placementId || ''}</span></td>
      <td>${o.student?.course ? coursePill(o.student.course) : '—'}</td>
      <td><span class="badge badge-primary">${o.offerType}</span></td>
      <td>${o.ctcLPA ? fmtLPA(o.ctcLPA) : o.stipendAmount ? `₹${o.stipendAmount}/mo` : '—'}</td>
      <td class="td-muted">${fmtDate(o.offerDate)}</td>
      <td>${statusBadge(o.acceptanceStatus, ACCEPTANCE)}</td>
      <td>${statusBadge(o.joiningStatus, JOINING)}</td>
    </tr>`).join('');
  }

  loadCompany();
  load();
</script>
</body>
</html>
