<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Companies — NFSU Placement</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="menu-toggle" id="menu-toggle">☰</button>
        <span class="topbar-title" id="page-title">Companies</span>
      </div>
      <div class="topbar-right">
        <button class="btn btn-primary btn-sm" data-roles="admin" onclick="openModal('modal-company')">+ Add Company</button>
      </div>
    </header>

    <div class="page-content">
      <div class="filter-bar">
        <div class="search-wrap">
          <span class="search-icon">🔍</span>
          <input type="text" id="search" placeholder="Search company…">
        </div>
        <select id="filter-cat">
          <option value="">All Categories</option>
          <option>A+</option><option>A</option><option>B</option><option>C</option>
        </select>
        <button class="btn btn-secondary btn-sm" onclick="loadCompanies()">Apply</button>
      </div>

      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px" id="companies-grid">
        <div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--text-muted)">Loading…</div>
      </div>
    </div>
  </div>
</div>

<!-- Add/Edit Company Modal -->
<div class="modal-overlay" id="modal-company">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="modal-company-title">Add Company</span>
      <button class="modal-close">✕</button>
    </div>
    <div class="modal-body">
      <form id="company-form">
        <input type="hidden" id="edit-company-id">
        <div class="form-grid">
          <div class="form-group full">
            <label>Company Name *</label>
            <input type="text" id="c-name" required>
          </div>
          <div class="form-group">
            <label>Category *</label>
            <select id="c-cat" required>
              <option value="">Select</option>
              <option>A+</option><option>A</option><option>B</option><option>C</option>
            </select>
          </div>
          <div class="form-group">
            <label>Min Package (LPA)</label>
            <input type="number" id="c-min" step="0.1" min="0">
          </div>
          <div class="form-group">
            <label>Max Package (LPA)</label>
            <input type="number" id="c-max" step="0.1" min="0">
          </div>
          <div class="form-group">
            <label>Status</label>
            <select id="c-active">
              <option value="true">Active</option>
              <option value="false">Inactive</option>
            </select>
          </div>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-secondary" data-close-modal>Cancel</button>
          <button type="submit" class="btn btn-primary">Save Company</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="../js/app.js"></script>
<script>
  const user = requireAuth(['admin','coordinator','recruiter','student']);
  initPage('Companies', 'Companies');

  const CAT_COLORS = {'A+':'purple','A':'primary','B':'success','C':'warning'};

  async function loadCompanies() {
    const search = document.getElementById('search').value;
    const cat = document.getElementById('filter-cat').value;
    const params = new URLSearchParams();
    if (search) params.set('search', search);
    if (cat) params.set('category', cat);

    const grid = document.getElementById('companies-grid');
    grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--text-muted)">Loading…</div>';

    const res = await apiFetch('/companies?' + params);
    const companies = res?.data?.companies || [];

    if (!companies.length) {
      grid.innerHTML = '<div style="grid-column:1/-1"><div class="empty-state"><div class="empty-icon">🏢</div><p>No companies found</p></div></div>';
      return;
    }

    grid.innerHTML = companies.map(c => `
      <div class="card" style="padding:20px">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px">
          <div>
            <div style="font-weight:700;font-size:1rem;margin-bottom:4px">${c.name}</div>
            <span class="badge badge-${CAT_COLORS[c.category]||'gray'}" style="font-size:.8rem">Category ${c.category}</span>
          </div>
          <span class="badge ${c.isActive?'badge-success':'badge-gray'}">${c.isActive?'Active':'Inactive'}</span>
        </div>
        <div style="font-size:.82rem;color:var(--text-muted);display:flex;flex-direction:column;gap:5px">
          <div>💰 Package: ${c.minPackageLPA ? `₹${c.minPackageLPA}–${c.maxPackageLPA} LPA` : '—'}</div>
          <div>📋 Placed: <strong id="placed-${c._id}">—</strong></div>
        </div>
        <div style="margin-top:14px;display:flex;gap:8px">
          <button class="btn btn-secondary btn-sm" style="flex:1" onclick="loadStats('${c._id}')">📊 Stats</button>
          ${user.role === 'admin' ? `<button class="btn btn-icon btn-sm" onclick="editCompany('${c._id}')">✏️</button>` : ''}
        </div>
      </div>`).join('');

    // Load placed counts
    companies.forEach(c => loadStats(c._id, true));
  }

  async function loadStats(id, silent = false) {
    const res = await apiFetch('/companies/' + id + '/stats');
    const el = document.getElementById('placed-' + id);
    if (el && res?.data) el.textContent = res.data.placedCount ?? '—';
    if (!silent && res?.data) {
      toast(`${res.data.name}: ${res.data.placedCount} placed`, 'info');
    }
  }

  async function editCompany(id) {
    const res = await apiFetch('/companies/' + id);
    if (!res?.data?.company) return toast('Failed to load', 'error');
    const c = res.data.company;
    document.getElementById('edit-company-id').value = c._id;
    document.getElementById('c-name').value = c.name;
    document.getElementById('c-cat').value = c.category;
    document.getElementById('c-min').value = c.minPackageLPA || '';
    document.getElementById('c-max').value = c.maxPackageLPA || '';
    document.getElementById('c-active').value = String(c.isActive);
    document.getElementById('modal-company-title').textContent = 'Edit Company';
    openModal('modal-company');
  }

  document.getElementById('company-form').addEventListener('submit', async e => {
    e.preventDefault();
    const id = document.getElementById('edit-company-id').value;
    const body = {
      name: document.getElementById('c-name').value,
      category: document.getElementById('c-cat').value,
      minPackageLPA: parseFloat(document.getElementById('c-min').value) || 0,
      maxPackageLPA: parseFloat(document.getElementById('c-max').value) || 0,
      isActive: document.getElementById('c-active').value === 'true',
    };
    const res = id
      ? await apiFetch('/companies/' + id, { method: 'PUT', body: JSON.stringify(body) })
      : await apiFetch('/companies', { method: 'POST', body: JSON.stringify(body) });
    if (res?.success) {
      closeModal('modal-company');
      toast(id ? 'Company updated' : 'Company added');
      loadCompanies();
      document.getElementById('company-form').reset();
      document.getElementById('edit-company-id').value = '';
    } else toast(res?.message || 'Save failed', 'error');
  });

  document.getElementById('search').addEventListener('keydown', e => { if (e.key==='Enter') loadCompanies(); });
  loadCompanies();
</script>
</body>
</html>
