<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Students — NFSU Placement</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="menu-toggle" id="menu-toggle">☰</button>
        <span class="topbar-title" id="page-title">Students</span>
      </div>
      <div class="topbar-right">
        <button class="btn btn-primary btn-sm" id="btn-add" data-roles="admin" onclick="openModal('modal-student')">+ Add Student</button>
        <a href="import.html" class="btn btn-secondary btn-sm" data-roles="admin">📥 Import</a>
      </div>
    </header>

    <div class="page-content">
      <div class="filter-bar">
        <div class="search-wrap">
          <span class="search-icon">🔍</span>
          <input type="text" id="search" placeholder="Search by name or placement ID…">
        </div>
        <select id="filter-course">
          <option value="">All Courses</option>
          <option>MTCS</option><option>MTAIDS</option><option>BTMTCSE</option><option>MSCCS</option><option>MSCDFIS</option>
        </select>
        <select id="filter-status">
          <option value="">All Status</option>
          <option value="unplaced">Unplaced</option>
          <option value="internship_only">Internship</option>
          <option value="fte_only">FTE</option>
          <option value="internship_fte">I+FTE</option>
        </select>
        <button class="btn btn-secondary btn-sm" onclick="loadStudents()">Apply</button>
      </div>

      <div class="card">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Placement ID</th><th>Name</th><th>Course</th><th>Batch</th>
                <th>Eligibility</th><th>Status</th><th>Category</th><th>Package</th><th>Actions</th>
              </tr>
            </thead>
            <tbody id="students-tbody">
              <tr><td colspan="9" style="text-align:center;padding:32px;color:var(--text-muted)">Loading…</td></tr>
            </tbody>
          </table>
        </div>
        <div class="pagination" id="pagination"></div>
      </div>
    </div>
  </div>
</div>

<!-- Add/Edit Student Modal -->
<div class="modal-overlay" id="modal-student">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="modal-student-title">Add Student</span>
      <button class="modal-close">✕</button>
    </div>
    <div class="modal-body">
      <form id="student-form">
        <input type="hidden" id="edit-id">
        <div class="form-grid">
          <div class="form-group">
            <label>Full Name *</label>
            <input type="text" id="f-name" placeholder="Student full name" required>
          </div>
          <div class="form-group">
            <label>Mobile *</label>
            <input type="tel" id="f-mobile" placeholder="10-digit mobile" maxlength="10" required>
          </div>
          <div class="form-group">
            <label>Email *</label>
            <input type="email" id="f-email" placeholder="student@nfsu.ac.in" required>
          </div>
          <div class="form-group">
            <label>Course *</label>
            <select id="f-course" required>
              <option value="">Select course</option>
              <option>MTCS</option><option>MTAIDS</option><option>BTMTCSE</option><option>MSCCS</option><option>MSCDFIS</option>
            </select>
          </div>
          <div class="form-group">
            <label>Batch *</label>
            <input type="text" id="f-batch" placeholder="e.g. 2026" required>
          </div>
          <div class="form-group">
            <label>Registration Status</label>
            <select id="f-reg">
              <option value="not_registered">Not Registered</option>
              <option value="registered">Registered</option>
              <option value="deregistered">Deregistered</option>
            </select>
          </div>
          <div class="form-group">
            <label>Eligibility Status</label>
            <select id="f-elig">
              <option value="pending">Pending</option>
              <option value="eligible">Eligible</option>
              <option value="ineligible">Ineligible</option>
            </select>
          </div>
          <div class="form-group" id="password-group">
            <label>Password *</label>
            <input type="password" id="f-password" placeholder="Min 8 characters">
          </div>
          <div class="form-group full">
            <label>Remarks</label>
            <textarea id="f-remarks" placeholder="Optional remarks…"></textarea>
          </div>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-secondary" data-close-modal>Cancel</button>
          <button type="submit" class="btn btn-primary" id="student-submit-btn">Save Student</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Archive Confirm Modal -->
<div class="modal-overlay" id="modal-archive">
  <div class="modal" style="max-width:400px">
    <div class="modal-header"><span class="modal-title">Archive Student</span><button class="modal-close">✕</button></div>
    <div class="modal-body">
      <div class="alert alert-warning"><span>⚠️</span><span>This will archive the student record. They will no longer appear in active lists.</span></div>
      <p style="font-size:.875rem">Student: <strong id="archive-name"></strong></p>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" data-close-modal>Cancel</button>
      <button class="btn btn-danger" id="confirm-archive">Archive</button>
    </div>
  </div>
</div>

<script src="../js/app.js"></script>
<script>
  const user = requireAuth(['admin', 'coordinator']);
  initPage('Students', 'Students');

  let currentPage = 1, archiveId = null;

  async function loadStudents(page = 1) {
    currentPage = page;
    const search = document.getElementById('search').value;
    const course = document.getElementById('filter-course').value;
    const status = document.getElementById('filter-status').value;
    const params = new URLSearchParams({ page, limit: 15 });
    if (search) params.set('search', search);
    if (course) params.set('course', course);
    if (status) params.set('status', status);

    const tbody = document.getElementById('students-tbody');
    tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;padding:32px;color:var(--text-muted)">Loading…</td></tr>';

    const res = await apiFetch('/students?' + params);
    if (!res?.data?.students) {
      tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;padding:32px;color:var(--text-muted)">Failed to load</td></tr>';
      return;
    }

    const { students, total, limit } = res.data;
    if (!students.length) {
      tbody.innerHTML = '<tr><td colspan="9"><div class="empty-state"><div class="empty-icon">🎓</div><p>No students found</p></div></td></tr>';
      return;
    }

    tbody.innerHTML = students.map(s => `
      <tr>
        <td><code style="font-size:.8rem;background:var(--surface-2);color:var(--primary-light);padding:2px 6px;border-radius:4px;border:1px solid var(--border)">${s.placementId || '—'}</code></td>
        <td><strong>${s.name}</strong></td>
        <td>${coursePill(s.course)}</td>
        <td>${s.batch}</td>
        <td>${statusBadge(s.eligibilityStatus, ELIGIBILITY_STATUS)}</td>
        <td>${statusBadge(s.placementStatus, PLACEMENT_STATUS)}</td>
        <td>${s.currentCategory ? statusBadge(s.currentCategory, CATEGORY_BADGE) : '<span class="td-muted">—</span>'}</td>
        <td>${fmtLPA(s.currentPackageLPA)}</td>
        <td>
          <div style="display:flex;gap:6px">
            <a href="student-detail.html?id=${s._id}" class="btn btn-icon" title="View">👁️</a>
            ${user.role === 'admin' || user.role === 'coordinator' ? `<button class="btn btn-icon" title="Edit" onclick="editStudent('${s._id}')">✏️</button>` : ''}
            ${user.role === 'admin' ? `<button class="btn btn-icon" title="Archive" onclick="confirmArchive('${s._id}','${s.name}')">🗄️</button>` : ''}
          </div>
        </td>
      </tr>`).join('');

    // Pagination
    const pages = Math.ceil(total / limit);
    const pg = document.getElementById('pagination');
    if (pages <= 1) { pg.innerHTML = ''; return; }
    pg.innerHTML = `<span class="page-info">Page ${page} of ${pages}</span>` +
      (page > 1 ? `<button class="page-btn" onclick="loadStudents(${page-1})">‹</button>` : '') +
      Array.from({length: Math.min(pages,5)}, (_,i) => {
        const p = Math.max(1, page-2) + i;
        return p <= pages ? `<button class="page-btn ${p===page?'active':''}" onclick="loadStudents(${p})">${p}</button>` : '';
      }).join('') +
      (page < pages ? `<button class="page-btn" onclick="loadStudents(${page+1})">›</button>` : '');
  }

  async function editStudent(id) {
    const res = await apiFetch('/students/' + id);
    if (!res?.data?.student) return toast('Failed to load student', 'error');
    const s = res.data.student;
    document.getElementById('edit-id').value = s._id;
    document.getElementById('f-name').value = s.name;
    document.getElementById('f-mobile').value = s.mobile || '';
    document.getElementById('f-email').value = s.email || '';
    document.getElementById('f-course').value = s.course;
    document.getElementById('f-batch').value = s.batch;
    document.getElementById('f-reg').value = s.registrationStatus;
    document.getElementById('f-elig').value = s.eligibilityStatus;
    document.getElementById('f-remarks').value = s.remarks || '';
    document.getElementById('modal-student-title').textContent = 'Edit Student';
    document.getElementById('password-group').style.display = 'none';
    document.getElementById('f-password').removeAttribute('required');
    openModal('modal-student');
  }

  function confirmArchive(id, name) {
    archiveId = id;
    document.getElementById('archive-name').textContent = name;
    openModal('modal-archive');
  }

  document.getElementById('confirm-archive').addEventListener('click', async () => {
    if (!archiveId) return;
    const res = await apiFetch('/students/' + archiveId + '/archive', { method: 'PATCH' });
    closeModal('modal-archive');
    if (res?.success) { toast('Student archived'); loadStudents(currentPage); }
    else toast(res?.message || 'Archive failed', 'error');
  });

  document.getElementById('student-form').addEventListener('submit', async e => {
    e.preventDefault();
    const id = document.getElementById('edit-id').value;
    const body = {
      name: document.getElementById('f-name').value,
      mobile: document.getElementById('f-mobile').value,
      email: document.getElementById('f-email').value,
      course: document.getElementById('f-course').value,
      batch: document.getElementById('f-batch').value,
      registrationStatus: document.getElementById('f-reg').value,
      eligibilityStatus: document.getElementById('f-elig').value,
      remarks: document.getElementById('f-remarks').value,
    };
    if (!id) {
      const pw = document.getElementById('f-password').value;
      if (!pw || pw.length < 8) { toast('Password must be at least 8 characters', 'error'); btn.disabled = false; btn.textContent = 'Save Student'; return; }
      body.password = pw;
    }
    const btn = document.getElementById('student-submit-btn');
    btn.disabled = true; btn.textContent = 'Saving…';
    const res = id
      ? await apiFetch('/students/' + id, { method: 'PUT', body: JSON.stringify(body) })
      : await apiFetch('/students', { method: 'POST', body: JSON.stringify(body) });
    btn.disabled = false; btn.textContent = 'Save Student';
    if (res?.success) {
      closeModal('modal-student');
      toast(id ? 'Student updated' : 'Student created');
      loadStudents(currentPage);
      document.getElementById('student-form').reset();
      document.getElementById('edit-id').value = '';
    } else {
      toast(res?.message || 'Save failed', 'error');
    }
  });

  // Search on enter
  document.getElementById('search').addEventListener('keydown', e => { if (e.key === 'Enter') loadStudents(); });

  // Reset modal on open
  document.getElementById('btn-add')?.addEventListener('click', () => {
    document.getElementById('student-form').reset();
    document.getElementById('edit-id').value = '';
    document.getElementById('modal-student-title').textContent = 'Add Student';
    document.getElementById('password-group').style.display = '';
    document.getElementById('f-password').setAttribute('required', 'required');
  });

  loadStudents();
</script>
</body>
</html>
