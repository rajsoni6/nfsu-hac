<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Drive Attendance — NFSU Placement</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="menu-toggle" id="menu-toggle">☰</button>
        <span class="topbar-title" id="page-title">Drive Attendance</span>
      </div>
      <div class="topbar-right">
        <button class="btn btn-primary btn-sm" onclick="openModal('modal-drive')">+ New Drive</button>
      </div>
    </header>

    <div class="page-content">
      <div class="page-header"><div><h1>Drive Attendance</h1><p>Create drives and log student attendance</p></div></div>

      <div style="display:grid;grid-template-columns:1fr;gap:20px;margin-bottom:20px">

        <!-- Log Attendance -->
        <div class="card">
          <div class="card-header"><span class="card-title">📅 Log Attendance</span></div>
          <div style="padding:4px 0">
            <form id="attendance-form">
              <div class="form-group">
                <label>Select Drive *</label>
                <select id="att-drive" required>
                  <option value="">Loading drives…</option>
                </select>
              </div>
              <div class="form-group">
                <label>Student Placement ID *</label>
                <input type="text" id="att-pid" placeholder="e.g. NFSU-2627-MTCS-001" required autocomplete="off">
              </div>
              <div class="form-group">
                <label>Attendance Status *</label>
                <select id="att-status">
                  <option value="present">Present</option>
                  <option value="absent">Absent</option>
                </select>
              </div>
              <div class="form-group" id="excuse-group" style="display:none">
                <label>Excused?</label>
                <select id="att-excused">
                  <option value="false">No</option>
                  <option value="true">Yes</option>
                </select>
              </div>
              <div class="form-group" id="excuse-note-group" style="display:none">
                <label>Excuse Note</label>
                <input type="text" id="att-excuse-note" placeholder="Reason for absence…">
              </div>
              <div id="att-result" style="margin-bottom:12px"></div>
              <button type="submit" class="btn btn-primary" id="att-btn">Log Attendance</button>
            </form>
          </div>
        </div>

      </div>

      <!-- Drives List -->
      <div class="card">
        <div class="card-header">
          <span class="card-title">🗂️ Recent Drives</span>
          <button class="btn btn-secondary btn-sm" onclick="loadDrives()">🔄 Refresh</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>Company</th><th>Category</th><th>Date</th><th>Type</th><th>Attendees</th></tr>
            </thead>
            <tbody id="drives-tbody">
              <tr><td colspan="5" style="text-align:center;padding:24px;color:var(--text-muted)">Loading…</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- New Drive Modal -->
<div class="modal-overlay" id="modal-drive">
  <div class="modal" style="max-width:440px">
    <div class="modal-header"><span class="modal-title">Create New Drive</span><button class="modal-close">✕</button></div>
    <div class="modal-body">
      <form id="drive-form">
        <div class="form-group">
          <label>Company *</label>
          <select id="drive-company" required><option value="">Select company…</option></select>
        </div>
        <div class="form-group">
          <label>Activity Type *</label>
          <select id="drive-type" required>
            <option value="ppt">PPT / Pre-Placement Talk</option>
            <option value="test">Aptitude / Written Test</option>
            <option value="interview">Interview</option>
            <option value="gd">Group Discussion</option>
            <option value="other">Other</option>
          </select>
        </div>
        <div class="form-group">
          <label>Drive Date *</label>
          <input type="date" id="drive-date" required>
        </div>
        <div class="form-group">
          <label>Description</label>
          <input type="text" id="drive-desc" placeholder="e.g. Campus Placement Drive 1">
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-secondary" data-close-modal>Cancel</button>
          <button type="submit" class="btn btn-primary" id="drive-btn">Create Drive</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="../js/app.js"></script>
<script>
  requireAuth(['admin']);
  initPage('Drive Attendance', 'Drive Attendance');

  const ACT_LABELS = { ppt:'PPT', test:'Test', interview:'Interview', gd:'GD', other:'Other' };

  // Show/hide excuse fields based on status
  document.getElementById('att-status').addEventListener('change', e => {
    const absent = e.target.value === 'absent';
    document.getElementById('excuse-group').style.display = absent ? 'block' : 'none';
    document.getElementById('excuse-note-group').style.display = absent ? 'block' : 'none';
    if (!absent) {
      document.getElementById('att-excused').value = 'false';
      document.getElementById('att-excuse-note').value = '';
    }
  });

  async function loadCompanies() {
    const res = await apiFetch('/companies');
    const companies = res?.data?.companies || [];
    const sel = document.getElementById('drive-company');
    sel.innerHTML = '<option value="">Select company…</option>';
    companies.forEach(c => {
      const o = document.createElement('option');
      o.value = c._id;
      o.textContent = `${c.name} [${c.category}]`;
      sel.appendChild(o);
    });
  }

  async function loadDrives() {
    const res = await apiFetch('/recruitment/drives');
    const drives = res?.data?.drives || [];

    // populate drive select in attendance form
    const sel = document.getElementById('att-drive');
    sel.innerHTML = '<option value="">Select a drive…</option>';
    drives.forEach(d => {
      const o = document.createElement('option');
      o.value = d._id;
      o.textContent = `${d.company?.name || '—'} — ${new Date(d.driveDate).toLocaleDateString('en-IN')} (${ACT_LABELS[d.activityType] || d.activityType})`;
      sel.appendChild(o);
    });

    // populate drives table
    const tbody = document.getElementById('drives-tbody');
    if (!drives.length) {
      tbody.innerHTML = '<tr><td colspan="5"><div class="empty-state"><div class="empty-icon">📅</div><p>No drives yet. Create one.</p></div></td></tr>';
      return;
    }
    tbody.innerHTML = drives.map(d => `<tr>
      <td><strong>${d.company?.name || '—'}</strong></td>
      <td>${d.company?.category ? `<span class="badge badge-primary">${d.company.category}</span>` : '—'}</td>
      <td class="td-muted">${new Date(d.driveDate).toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' })}</td>
      <td><span class="badge badge-gray">${ACT_LABELS[d.activityType] || d.activityType}</span></td>
      <td>${d.attendees?.length ?? 0} logged</td>
    </tr>`).join('');
  }

  document.getElementById('attendance-form').addEventListener('submit', async e => {
    e.preventDefault();
    const driveId = document.getElementById('att-drive').value;
    const placementId = document.getElementById('att-pid').value.trim().toUpperCase();
    const status = document.getElementById('att-status').value;
    const excused = document.getElementById('att-excused').value;
    const excuseNote = document.getElementById('att-excuse-note').value;

    if (!driveId) { toast('Select a drive first', 'error'); return; }
    if (!placementId) { toast('Enter placement ID', 'error'); return; }

    const btn = document.getElementById('att-btn');
    btn.disabled = true; btn.textContent = 'Logging…';

    const res = await apiFetch('/recruitment/attendance', {
      method: 'POST',
      body: JSON.stringify({ driveId, placementId, status, excused, excuseNote }),
    });

    btn.disabled = false; btn.textContent = 'Log Attendance';

    const resultEl = document.getElementById('att-result');
    if (res?.success) {
      resultEl.innerHTML = `<div class="alert alert-success"><span>✅</span><div>Attendance logged for <strong>${placementId}</strong> — ${status}</div></div>`;
      document.getElementById('att-pid').value = '';
      document.getElementById('att-status').value = 'present';
      document.getElementById('excuse-group').style.display = 'none';
      document.getElementById('excuse-note-group').style.display = 'none';
      setTimeout(() => { resultEl.innerHTML = ''; }, 3000);
    } else {
      resultEl.innerHTML = `<div class="alert alert-danger"><span>❌</span><div>${res?.message || 'Failed to log attendance'}</div></div>`;
    }
  });

  document.getElementById('drive-form').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = document.getElementById('drive-btn');
    btn.disabled = true; btn.textContent = 'Creating…';

    const res = await apiFetch('/recruitment/drive', {
      method: 'POST',
      body: JSON.stringify({
        companyId: document.getElementById('drive-company').value,
        activityType: document.getElementById('drive-type').value,
        driveDate: document.getElementById('drive-date').value,
        description: document.getElementById('drive-desc').value,
      }),
    });

    btn.disabled = false; btn.textContent = 'Create Drive';
    closeModal('modal-drive');

    if (res?.success) {
      toast('Drive created successfully');
      document.getElementById('drive-form').reset();
      loadDrives();
    } else {
      toast(res?.message || 'Failed to create drive', 'error');
    }
  });

  loadCompanies();
  loadDrives();
</script>
</body>
</html>
