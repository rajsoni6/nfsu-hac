<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login — NFSU Placement Portal</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="login-header">
      <div class="logo-text">🎓 NFSU Placement</div>
      <div class="logo-sub">National Forensic Sciences University · Session 2026–27</div>
    </div>
    <div class="login-body">
      <!-- Step 1: Credentials -->
      <div id="step-login">
        <h2>Sign In</h2>
        <p>Enter your credentials to access the portal.</p>
        <div id="login-error" class="alert alert-danger" style="display:none"></div>
        <form id="login-form">
          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="e.g. admin" autocomplete="username" required>
          </div>
          <div class="form-group" style="margin-bottom:6px">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
          </div>
          <button type="submit" class="btn btn-primary" id="login-btn">Sign In</button>
        </form>
      </div>

      <!-- Step 2: MFA -->
      <div id="step-mfa" style="display:none">
        <h2>Two-Factor Auth</h2>
        <p>Enter the 6-digit code from your authenticator app.</p>
        <div id="mfa-error" class="alert alert-danger" style="display:none"></div>
        <form id="mfa-form">
          <div class="form-group">
            <label for="mfa-code">Authenticator Code</label>
            <input type="text" id="mfa-code" placeholder="000000" maxlength="6" inputmode="numeric" pattern="\d{6}" required>
          </div>
          <button type="submit" class="btn btn-primary">Verify</button>
          <button type="button" class="btn btn-secondary" id="back-btn" style="margin-top:8px">← Back</button>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="js/app.js"></script>
<script>
  function getHomePage(role) {
    if (role === 'student') return 'pages/profile.html';
    if (role === 'recruiter') return 'pages/recruiter.html';
    return 'pages/dashboard.html';
  }

  // Redirect if already logged in
  if (getToken() && getUser()) {
    sessionStorage.removeItem('_loggingOut');
    window.location.replace(getHomePage(getUser().role));
  }

  let pendingUser = null;

  document.getElementById('login-form').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = document.getElementById('login-btn');
    btn.textContent = 'Signing in…'; btn.disabled = true;
    const errEl = document.getElementById('login-error');
    errEl.style.display = 'none';

    const res = await fetch('http://localhost:5000/api/auth/login', {
      method: 'POST', credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: document.getElementById('username').value.trim(), password: document.getElementById('password').value }),
    }).then(r => r.json()).catch(() => null);

    btn.textContent = 'Sign In'; btn.disabled = false;

    if (!res || !res.success) {
      errEl.textContent = res?.message || 'Login failed. Check credentials.';
      errEl.style.display = 'flex'; return;
    }

    if (res.data.mfaRequired) {
      pendingUser = res.data.tempToken;
      document.getElementById('step-login').style.display = 'none';
      document.getElementById('step-mfa').style.display = 'block';
      return;
    }

    setAuth(res.data.accessToken, res.data.user);
    sessionStorage.removeItem('_loggingOut');
    window.location.replace(getHomePage(res.data.user.role));
  });

  document.getElementById('mfa-form').addEventListener('submit', async e => {
    e.preventDefault();
    const errEl = document.getElementById('mfa-error');
    errEl.style.display = 'none';
    const res = await fetch('http://localhost:5000/api/auth/mfa/verify', {
      method: 'POST', credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: document.getElementById('mfa-code').value, tempToken: pendingUser }),
    }).then(r => r.json()).catch(() => null);

    if (!res?.success) {
      errEl.textContent = res?.message || 'Invalid code.';
      errEl.style.display = 'flex'; return;
    }
    setAuth(res.data.accessToken, res.data.user);
    sessionStorage.removeItem('_loggingOut');
    window.location.replace(getHomePage(res.data.user.role));
  });

  document.getElementById('back-btn').addEventListener('click', () => {
    document.getElementById('step-mfa').style.display = 'none';
    document.getElementById('step-login').style.display = 'block';
  });
</script>
</body>
</html>
